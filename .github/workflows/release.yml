name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare dist directory
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist

      - name: Build Windows App Image (jpackage)
        run: |
          jpackage `
            --type app-image `
            --name GeradorLaudos `
            --input target `
            --main-jar gerador-laudos-1.0-SNAPSHOT.jar `
            --main-class lauds.Main `
            --dest dist `
            --java-options "-Dfile.encoding=UTF-8"

      - name: Zip App Image
        run: |
          Compress-Archive -Path dist/GeradorLaudos -DestinationPath dist/GeradorLaudos-Windows.zip

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION="v$(date +'%Y.%m.%d-%H%M')"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            target/gerador-laudos-1.0-SNAPSHOT.jar
            dist/GeradorLaudos-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
